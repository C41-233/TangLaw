<div class="container"><header><h1>第三百零七条之一 汤火伤</h1></header><div class="law"><p>本法所称“用汤、火伤人”，是指灼烂皮肤。
</p></div><p>本条规定了用汤、火伤人中“伤”的含义。
</p><p>用汤、火伤人中的“伤”，是指灼烂皮肤，即受伤处必须破皮、腐肉、焦黑，属于肉眼可见的器质性损毁。如果只是被热水烫出红斑、起几个小水泡（未破溃），或火星燎去几根汗毛但皮肤完整，不归入“汤火伤”重罪条款。
</p><p>用汤、火伤人致灼烂皮肤的，属于折伤的一种。</p><div class="src"><p>「及湯火傷人」，謂灼爛皮膚。
</p></div></div>
