<div class="container"><header><h1>第三百三十九条之一 过失</h1></header><div class="law"><p>本法所称“过失”，是指耳目所不及，思虑所不到。
</p></div><p>本条规定了过失的含义。
</p><p>过失犯罪，区别于故意犯罪。过失，是指耳目所不及，思虑所不到。即，行为人感官未能察觉，或者思虑未能预见危害发生的可能。
</p><p>例如，二人共同抬举重物，一人因力量不足而失控致另一人被砸死。登上高处失足跌落压伤他人。在射击禽兽的过程中，误击中他人。
</p><p>过失犯罪中最典型的就是过失杀伤人。</p></div>
