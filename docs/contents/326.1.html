<title>第三百二十六条之一 过失杀、过失伤夫罪</title>
</head>
<body>
<div class="container"><header><h1>第三百二十六条之一 过失杀、过失伤夫罪</h1></header><div class="law"><p>妻、妾、勝过失杀伤夫的，各减殴杀伤夫二等。
</p></div><div class="src"><p>過失殺傷者，各減二等。
</p><p>【疏】議曰：「過失殺者，各減二等」，謂妻、妾、媵過失殺者，並徒三年。假如妻折夫一支，加凡人三等，流三千里，過失減二等，合徒二年半；若媵及妾折夫一支合絞，過失減二等，合徒三年。自餘折傷，各隨輕重，準此加減之例。
</p></div></div>
