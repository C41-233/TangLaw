<div class="container"><header><h1>第三百二十六条之四 媵</h1></header><div class="law"><p>本法有关妾的规定，适用于媵。但是，法律另有规定的除外。
</p></div><div class="src"><p>（餘條媵無文者，與妾同。）
</p><p>【疏】議曰：注云「餘條媵無文者」，謂上條「毆妾折傷以上，減妻二等」之類，妻、妾相犯及犯夫，當條無文者，各與妾同。
</p></div></div>
