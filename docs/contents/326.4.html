</head>
<body>
<div class="container"><header><h1>第三百二十六条之四 妻媵妾詈骂相犯</h1></header><div class="law"><p>妾詈骂妻的，依照妾犯夫的规定处罚；媵詈骂妻的，减妾犯妻一等；妾詈骂媵的，加凡人一等。
</p></div></div>
