<div class="container"><header><h1>第三百二十六条之四 媵</h1></header><div class="law"><p>本法有关妾的规定，适用于媵。但是，法律另有规定的除外。
</p></div><p>本条对媵的法律适用作了特别规定。
</p><p>根据本条规定，除非法律另有规定，有关妾的规定，同样适用于媵。这里的适用既包括犯罪主体的适用，也包括犯罪客体的适用。
</p><p>例如，本法<a href="325.html" class="link-article">第三百二十五条</a>仅规定了夫殴妻、夫殴妾、妻殴妾的处罚规则，没有规定夫殴媵、妻殴媵的处罚规则。因此，夫殴媵适用夫殴妾的处罚规则，妻殴媵适用妻殴妾的处罚规则。</p><div class="src"><p>（餘條媵無文者，與妾同。）
</p><p>【疏】議曰：注云「餘條媵無文者」，謂上條「毆妾折傷以上，減妻二等」之類，妻、妾相犯及犯夫，當條無文者，各與妾同。
</p></div></div>
