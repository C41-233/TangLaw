<div class="container"><header><h1>第二百九十二条之二 和卖人罪</h1></header><div class="law"><p>和同相卖为奴婢的，皆流二千里。未售的，减一等。
</p></div><div class="src"><p>若和同相賣為奴婢者，皆流二千里；賣未售者，減一等。（下條準此。）
</p><p>【疏】議曰：「若和同相賣」，謂元謀兩和，相賣為奴婢者，賣人及被賣人，罪無首從，皆流二千里。其數人共賣他人，自依首從之法。「賣未售者，減一等」，謂和同相賣，未售事發，各徒三年。注云「下條準此」，謂下條「得逃亡奴婢而賣未售」及「賣期親卑幼及孫之婦等為奴婢未售」者，亦減一等，故云「準此」。
</p></div></div>
