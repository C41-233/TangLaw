<div class="container"><header><h1>子之妻</h1></header><div class="word"><div class="world-title">子之妻</div><div class="word-content"><p>子之妻，也称"妇"。“妻”是相对于“夫”而言的称谓，“妇”是相对于“夫家”而言的称谓。
</p><p>嫡长子之妻（嫡妇）属期亲，众子之妻（众妇）属大功亲。
</p></div></div><table class="x-table"><caption>父母对子之妻的犯罪</caption><thead><tr><th colspan="2">罪行</th><th>法定刑</th><th>十恶</th><th>法条</th></tr></thead><tbody><tr><th rowspan="4">殴打</th><th>致废疾</th><td>杖一百</td><td /><td><a href="330.2.html" class="link-article">第三百三十条之二</a></td></tr><tr><th>致笃疾</th><td>徒一年</td><td /><td><a href="330.2.html" class="link-article">第三百三十条之二</a></td></tr><tr><th>（斗殴）致死</th><td>徒三年</td><td /><td><a href="330.2.html" class="link-article">第三百三十条之二</a></td></tr><tr><th>（故殴）致死</th><td>流二千里</td><td /><td><a href="330.2.html" class="link-article">第三百三十条之二</a></td></tr><tr><th colspan="2">过失杀伤</th><td>无罪</td><td /><td><a href="330.2.html" class="link-article">第三百三十条之二</a></td></tr></tbody></table></div>
