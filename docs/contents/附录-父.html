<div class="container"><header><h1>父</h1></header><div class="word"><div class="world-title">父</div><div class="word-content"><p>根据<a href="52.html" class="link-article">第五十二条</a>的规定，父包括生父和养父，不包括继父。
</p><p>子、在室女、归家出赘子为父服斩衰三年；为人后者为生父，出赘子、出嫁女、出采女为父，服齐衰不杖期。
</p><p>根据<a href="52.html" class="link-article">第五十二条</a>的规定，嫡孙承祖的，祖父母同父母，但是适用缘坐的除外。
</p></div></div><table class="x-table"><caption>缘坐</caption><thead><tr><th colspan="2">罪行</th><th>法定刑</th><th>法条</th></tr></thead><tbody><tr><th rowspan="2">谋反</th><th>×</th><td>绞</td><td><a href="248.html" class="link-article">第二百四十八条</a></td></tr><tr><th>言词不能煽动众人，威力不足以率领他人起事</th><td>流三千里</td><td><a href="248.html" class="link-article">第二百四十八条</a></td></tr><tr><th colspan="2">大逆</th><td>绞</td><td><a href="248.1.html" class="link-article">第二百四十八条之一</a></td></tr></tbody></table></div>
