<div class="container"><header><h1>孙（女）、曾孙（女）、玄孙（女）</h1></header><div class="word"><div class="world-title">孙</div><div class="word-content"><p>孙，是指子之子，属大功亲。
</p><p>根据<a href="52.html" class="link-article">第五十二条</a>的规定，<span class="article-ref">「本法称“期亲”、“祖父母”的，曾祖父母、高祖父母同；称“孙”的，曾孙、玄孙同。」</span>
</p><p>根据<a href="52.html" class="link-article">第五十二条</a>的规定，<span class="article-ref">「本法称“子”、“孙”的，男女同。但是，适用缘坐的除外。」</span>类比适用到孙，即孙包括孙子和孙女。但是在适用缘坐时，孙仅指孙子，不包括孙女。
</p></div></div><table class="x-table"><caption>祖父母对孙（女）、曾祖父母对曾孙（女）、高祖父母对玄孙（女）的犯罪</caption><thead><tr><th>罪行</th><th>法定刑</th><th>十恶</th><th>法条</th></tr></thead><tbody><tr><th>告</th><td>无罪</td><td /><td><a href="347.2.html" class="link-article">第三百四十七条之二</a></td></tr><tr><th>诬告</th><td>无罪</td><td /><td><a href="347.2.html" class="link-article">第三百四十七条之二</a></td></tr></tbody></table><table class="x-table"><caption>缘坐</caption><thead><tr><th>罪行</th><th>法定刑</th><th>法条</th></tr></thead><tbody><tr><th>谋反</th><td>没官</td><td><a href="248.html" class="link-article">第二百四十八条</a></td></tr><tr><th>大逆</th><td>没官</td><td><a href="248.1.html" class="link-article">第二百四十八条之一</a></td></tr></tbody></table></div>
