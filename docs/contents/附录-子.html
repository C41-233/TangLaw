<div class="container"><header><h1>子</h1></header><div class="word"><div class="world-title">子</div><div class="word-content"><p>子，即儿。
</p><p>根据<a href="52.html" class="link-article">第五十二条</a>的规定：<span class="article-ref">「本法称“子”、“孙”的，男女同。但是，适用缘坐的除外。」</span>因此，子包括儿和女。但是在适用缘坐时，子仅指儿，不包括女。
</p><p>根据<a href="52.html" class="link-article">第五十二条</a>的规定：<span class="article-ref">「嫡孙承祖的，祖父母同父母。但是，适用缘坐的除外。」</span>因此，除适用缘坐外，"嫡孙"适用有关"子"的规定。
