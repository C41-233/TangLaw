<div class="container"><header><h1>夫</h1></header><div class="word"><div class="world-title">夫</div><div class="word-content"><p>夫，指婚姻关系中，与妻相对的男方。男称娶，女称嫁。媵、妾同样适用。
</p><p>夫的服制为斩衰三年。
</p><p>在律典的适用中需要注意以下特殊情形：
1、三月庙见、未庙见、就婚夫，都是刑法上的夫。
2、订婚夫，在婚姻关系中属于法律上的夫，但不属于刑法上的夫。
</p></div></div></div>
