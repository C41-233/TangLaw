</head>
<body>
<div class="container"><header><h1>第三百二十八条之二 过失杀伤尊长罪</h1></header><div class="law"><p>过失杀伤兄姊、伯叔父母、姑、外祖父母的，各减殴杀伤二等。
</p></div><div class="src"><p>過失殺傷者，各減本殺傷罪二等。
</p><p>【疏】議曰：過失殺若傷，「各減本殺傷二等」，謂過失殺者，各減死罪二等，合徒三年；過失折齒者，從流減二等之類。其過失之罪，兄姊以下，並同減二等。
</p></div></div>
