<div class="container"><header><h1>弟妹</h1></header><div class="word"><div class="world-title">弟妹</div><div class="word-content"><p>弟妹，即弟和妹，属期亲。
</p><div class="word"><div class="world-title">弟</div><div class="word-content"><p>弟，是指同父或者同母而年幼于己的男性同辈。
</p><p>弟是期亲卑幼，服制是齐衰不杖期。
</p></div></div><div class="word"><div class="world-title">妹</div><div class="word-content"><p>妹，是指同父或者同母而年幼于己的女性同辈。
</p><p>妹是期亲卑幼。在室妹的服制是齐衰不杖期，出嫁妹的服制是大功。
