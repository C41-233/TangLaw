<div class="container"><header><h1>第三百三十条之一 殴打尊长罪、过失杀伤尊长罪（夫之祖父母、父母）</h1></header><div class="law"><p>妻妾殴打夫之祖父母、父母的，绞；致伤的，皆斩。过失杀的，徒三年；过失伤的，徒二年。
</p></div><p>本条规定了殴打尊长罪、过失杀伤尊长罪，犯罪主体是妻妾，客体是夫之祖父母、父母。
</p><p>妻妾殴打夫之祖父母、父母的，绞；致伤的，皆斩。称“皆斩”，说明妻妾共同殴打夫之祖父母、父母时，不区分首从，一律处斩。
</p><p>妻妾过失杀夫之祖父母、父母的，徒三年；过失伤夫之祖父母、父母的，徒二年。</p></div>
