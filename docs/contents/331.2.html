<div class="container"><header><h1>第三百三十一条之二 殴伤子孙之故妻妾罪</h1></header><div class="law"><p>故夫之父母殴打子孙之故妻妾，致折伤以上的，各减凡人三等；致死的，绞。过失致死的，不论。
