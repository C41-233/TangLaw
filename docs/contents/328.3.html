<div class="container"><header><h1>第三百二十八条之三 殴杀卑幼罪（期亲卑幼）</h1></header><div class="law"><p>殴杀弟妹、兄弟之子孙、外孙的，徒三年；用刃或者故杀的，流二千里。过失杀的，各不论。
</p><p>殴杀兄弟之曾孙、玄孙的，依照本服的规定处理。
</p></div><p>本条规了殴杀卑幼罪，适用于期亲卑幼。
</p><h2>期亲弟妹</h2><p>斗殴杀期亲弟妹的，徒三年；用刃斗殴杀的，或者故殴杀的，流二千里。
</p><div class="word"><div class="world-title">弟妹</div><div class="word-content"><p>弟妹，即弟和妹，属期亲。
</p><div class="word"><div class="world-title">弟</div><div class="word-content"><p>弟，是指同父或者同母而年幼于己的男性同辈。
</p><p>弟是期亲卑幼，服制是齐衰不杖期。
</p></div></div><div class="word"><div class="world-title">妹</div><div class="word-content"><p>妹，是指同父或者同母而年幼于己的女性同辈。
</p><p>妹是期亲卑幼。在室妹的服制是齐衰不杖期，出嫁妹的服制是大功。
</p></div></div></div></div></div>
