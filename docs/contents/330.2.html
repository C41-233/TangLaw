<div class="container"><header><h1>第三百三十条之二 殴打卑幼罪（子孙之妇）</h1></header><div class="law"><p>殴打子孙之妇，致废疾的，杖一百；致笃疾的，加一等；致死的，徒三年。故杀的，流二千里。过失杀的，不论。
</p><p>殴打子孙之妾的，各减二等。
</p></div></div>
