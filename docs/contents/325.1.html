<title>第三百二十五条之一 夫过失杀妻妾的规定</title>
</head>
<body>
<div class="container"><header><h1>第三百二十五条之一 夫过失杀妻妾的规定</h1></header><div class="law"><p>夫过失杀妻妾的，或者妻过失杀妾的，不论。
</p></div><p>本条对夫过失杀妻妾、妻过失杀妾的情形作了特别规定。
</p><p>夫过失杀妻、夫过失杀妾、妻过失杀妾，都不追究刑事责任。因为主观上没有恶意，因此不以犯罪论处。
</p><p>举重以明轻，夫过失伤妻妾的，也不论。</p><div class="src"><p>過失殺者，各勿論。
</p><p>【疏】議曰：「過失殺者，各勿論」，為無惡心，故得無罪。
</p></div></div>
</body>
