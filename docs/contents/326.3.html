<title>第三百二十六条之三 妻妾媵殴打相犯</title>
</head>
<body>
<div class="container"><header><h1>第三百二十六条之三 妻妾媵殴打相犯</h1></header><div class="law"><p>妾殴打妻的，依照妾犯夫的规定处罚；媵殴打妻的，减妾犯妻一等；妾殴打媵的，加凡人一等。致死的，各斩。
</p></div><div class="src"><p>若妾犯妻者，與夫同。媵犯妻者，減妾一等。妾犯媵者，加凡人一等。殺者，各斬。
</p><p>【疏】議曰：「若妾犯妻者，與犯夫同」，謂毆者，徒一年半；死者，斬。「媵犯妻者，減妾一等」，毆者，徒一年；傷重者，從重上減妾一等。「妾犯媵者，加凡人一等」，謂毆者，笞五十；折一齒者，徒一年半之類。「死者，各斬」，謂媵及妾犯夫及妻，若妾犯媵，毆殺者，各斬。
</p></div></div>
