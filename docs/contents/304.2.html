<div class="container"><header><h1>第三百零四条之二 斗殴人罪（致折肋、眇两目）</h1></header><div class="law"><p>斗殴人，致折肋或者眇两目的，徒二年。
</p></div><p>本条规定了斗殴人罪，属六个凡人相殴条款的第四条。
</p><div class="word"><div class="world-title">斗殴</div><div class="word-content"><p>斗，指争斗。殴，指殴打、殴击。斗殴，即因争斗而殴打，被害人存在一定的过错。通常而言，斗殴双方都要入罪。
</p><p>与斗殴相对的概念是“故殴”。</p></div></div><h2>罪状</h2><h5>折肋</h5><p>折肋，即折断肋骨。
</p><h5>眇两目</h5><p>眇[miǎo]，指严重损伤视力，但并未完全失明。眇两目，即导致双眼视力均严重损伤。
</p><p>眇一目的法定刑规定在<a href="303.html" class="link-article">第三百零三条</a>。
</p><div class="src"><p>折人肋，眇其兩目，徒二年。
</p><p>【疏】議曰：「及折人肋」，謂鬥毆人折肋；「眇其兩目」，亦謂虧損其明而猶見物。
</p></div></div>
