<title>第三百三十一条之一 詈骂故夫之父祖罪</title>
</head>
<body>
<div class="container"><header><h1>第三百三十一条之一 詈骂故夫之父祖罪</h1></header><div class="law"><p>妻妾詈骂故夫之祖父母、父母的，减舅姑二等。
</p></div><p>本条规定了詈骂故夫之父祖罪。
</p><p>本罪的主体是妻妾，客体是故夫之祖父母、父母。根据<a href="255.1.html" class="link-article">第二百五十五条之一</a>的规定：<span class="article-ref">「本法称“故夫”的，限夫亡后改嫁。」</span>
</p><p>妻妾詈骂故夫之祖父母、父母的，减詈骂舅姑二等。詈骂舅姑规定在<a href="330.html" class="link-article">第三百三十条</a>：<span class="article-ref">「妻妾詈骂夫之祖父母、父母的，徒三年。」</span>因此，妻妾詈骂故夫之祖父母、父母的，徒二年。</p></div>
</body>
